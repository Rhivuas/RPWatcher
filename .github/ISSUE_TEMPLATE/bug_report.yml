name: Fehlerbericht
description: Einen reproduzierbaren Fehler in RPWatcher melden
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Danke für den Bericht. Bitte keine Accountdaten, GUIDs, vollständigen RP-Profile oder private Chatverläufe einfügen.
  - type: input
    id: rpwatcher-version
    attributes:
      label: RPWatcher-Version
      placeholder: "0.9.0"
    validations:
      required: true
  - type: input
    id: wow-version
    attributes:
      label: WoW-Retail-Version
      description: Clientversion beziehungsweise Interface-Build
      placeholder: "Retail 12.0.7 / Interface 120007"
    validations:
      required: true
  - type: input
    id: trp3-version
    attributes:
      label: Total-RP-3-Version
      description: Version oder „deaktiviert/nicht installiert“
      placeholder: "3.3.7 oder deaktiviert"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduktionsschritte
      description: Möglichst kurze, nummerierte Schritte
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Tatsächliches Verhalten
    validations:
      required: true
  - type: textarea
    id: bugsack
    attributes:
      label: BugSack- oder Lua-Ausgabe
      description: Bitte private Namen und Chattexte entfernen. „Keine Meldung“ ist eine gültige Angabe.
      render: text
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnoseausgaben
      description: `/rpw plates` und bei Performanceproblemen `/rpw perf report`; keine internen Tabellen oder Profildaten ergänzen.
      render: text
  - type: textarea
    id: addons
    attributes:
      label: Andere Nameplate- oder UI-Addons
      description: Relevante aktive Addons und Versionen
  - type: checkboxes
    id: privacy
    attributes:
      label: Datenschutz
      options:
        - label: Ich habe Accountdaten, GUIDs, vollständige Profile und private Chatdaten entfernt.
          required: true
